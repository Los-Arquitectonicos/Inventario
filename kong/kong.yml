# ==========================================
# KONG API GATEWAY - CONFIGURACIÓN DECLARATIVA
# ==========================================
# ProvesiWMS Service Discovery
# Modo: DB-less (sin base de datos)
# Versión: Kong 3.5.x
# ==========================================

_format_version: "3.0"
_transform: true

# ==========================================
# SERVICES & ROUTES
# ==========================================

services:
  # -----------------------------------------
  # Service 1: Django Backend API (Principal)
  # -----------------------------------------
  - name: django-api
    url: http://DJANGO_UPSTREAM:8000
    retries: 3
    connect_timeout: 5000
    write_timeout: 60000
    read_timeout: 60000
    
    routes:
      - name: django-api-route
        paths:
          - /api
          - /inventario
          - /admin
        strip_path: false
        preserve_host: true
        methods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          policy: local
          fault_tolerant: true
          hide_client_headers: false
          
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
            - X-Kong-Request-ID
          exposed_headers:
            - X-Kong-Request-ID
          credentials: true
          max_age: 3600
          preflight_continue: false


  # -----------------------------------------
  # Service 3: Config & Feature Flags
  # -----------------------------------------
  - name: config-service
    url: http://CONFIG_UPSTREAM:3003
    retries: 2
    connect_timeout: 3000
    
    routes:
      - name: config-route
        paths:
          - /config
          - /features
        strip_path: false
        
    plugins:
      - name: rate-limiting
        config:
          minute: 50
          policy: local

# ==========================================
# UPSTREAMS (Load Balancing para servicios)
# ==========================================

upstreams:
  - name: DJANGO_UPSTREAM
    algorithm: round-robin
    healthchecks:
      active:
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
        http_path: /inventario/
        timeout: 5
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_failures: 3
    
    # Los targets se agregan dinámicamente via Admin API o template
    # targets:
    #   - target: app-server-1:8000
    #     weight: 100
    #   - target: app-server-2:8000
    #     weight: 100

# ==========================================
# GLOBAL PLUGINS
# ==========================================

plugins:
  # Correlation ID para tracking de requests
  - name: correlation-id
    config:
      header_name: X-Kong-Request-ID
      generator: uuid
      echo_downstream: true
  
  # Logging a archivo
  - name: file-log
    config:
      path: /var/log/kong/access.log
      reopen: true

# ==========================================
# CONSUMERS (Opcional - para autenticación avanzada)
# ==========================================
# consumers:
#   - username: django-backend
#     keyauth_credentials:
#       - key: your-api-key-here

# ==========================================
# KONG GATEWAY - ARCHIVO DE CONFIGURACIÓN
# ==========================================
# ProvesiWMS Service Discovery
# Modo: DB-less (declarativo)
# ==========================================

# -----------------------------------------
# DATABASE CONFIGURATION
# -----------------------------------------
# Usar modo DB-less (sin base de datos)
database = off

# Ruta al archivo de configuración declarativa
declarative_config = /etc/kong/kong.yml

# -----------------------------------------
# PROXY LISTENERS
# -----------------------------------------
# Puerto principal para proxy HTTP
proxy_listen = 0.0.0.0:8000

# Puerto para proxy HTTPS (opcional, ALB maneja SSL)
# proxy_listen = 0.0.0.0:8443 ssl

# -----------------------------------------
# ADMIN API LISTENERS
# -----------------------------------------
# Admin API solo en localhost por seguridad
admin_listen = 127.0.0.1:8001

# Deshabilitar Admin GUI (Kong Manager)
admin_gui_listen = off

# -----------------------------------------
# STATUS LISTENER (Health Checks)
# -----------------------------------------
status_listen = 0.0.0.0:8100

# -----------------------------------------
# LOGGING
# -----------------------------------------
log_level = info

# Formato de logs
proxy_access_log = /var/log/kong/access.log
proxy_error_log = /var/log/kong/error.log
admin_access_log = /var/log/kong/admin_access.log
admin_error_log = /var/log/kong/admin_error.log

# -----------------------------------------
# PERFORMANCE TUNING
# -----------------------------------------
# Número de workers (ajustar según CPU)
nginx_worker_processes = auto

# Límites de conexiones
upstream_keepalive_pool_size = 60
upstream_keepalive_max_requests = 100
upstream_keepalive_idle_timeout = 60

# -----------------------------------------
# SECURITY
# -----------------------------------------
# Deshabilitar headers que revelan versión
headers = off

# Trusted IPs (para X-Forwarded-For desde ALB)
trusted_ips = 0.0.0.0/0,::/0
real_ip_header = X-Forwarded-For
real_ip_recursive = on

# -----------------------------------------
# PLUGINS
# -----------------------------------------
# Plugins habilitados (bundled = todos los incluidos)
plugins = bundled
